name: Smoke Test

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      image-repository:
        description: "Test published digests from digest-<arch> artifacts instead of rebuilding"
        type: string
        required: false
        default: ""

concurrency:
  group: smoke-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TEST_IMAGE: nicotine-plus-smoke-test

jobs:
  smoke-test:
    name: Smoke Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            base_image: ghcr.io/linuxserver/baseimage-selkies:ubuntunoble
          - arch: arm64
            runner: ubuntu-24.04-arm
            base_image: ghcr.io/linuxserver/baseimage-selkies:arm64v8-ubuntunoble
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build metadata
        if: ${{ !inputs.image-repository }}
        id: get_version
        run: |
          echo "VERSION=$(cat .github/.current-release)" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: ${{ !inputs.image-repository }}
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image for testing
        if: ${{ !inputs.image-repository }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ env.TEST_IMAGE }}:latest
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            VERSION=${{ steps.get_version.outputs.VERSION }}
            BUILD_DATE=${{ steps.get_version.outputs.BUILD_DATE }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Download published image digest
        if: ${{ inputs.image-repository != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.image-repository != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact published image
        if: ${{ inputs.image-repository != '' }}
        env:
          IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        run: |
          DIGEST=$(ls "$RUNNER_TEMP/digests")
          if [[ ! "$DIGEST" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Expected exactly one image digest for this architecture"
            exit 1
          fi
          IMAGE="$IMAGE_REPOSITORY@sha256:$DIGEST"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$TEST_IMAGE:latest"

      - name: Start container
        run: |
          docker run -d \
            --name smoke-test \
            -e PUID=1000 \
            -e PGID=1000 \
            -p 6080:6080 \
            -p 6081:6081 \
            --shm-size=1gb \
            ${{ env.TEST_IMAGE }}:latest

      - name: Wait for Selkies web UI
        run: |
          echo "Waiting for Selkies web UI to become ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6080/ > /dev/null 2>&1; then
              echo "Web UI is ready after ~${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Web UI did not become ready within 120s"
          docker logs smoke-test
          exit 1

      - name: Verify Nicotine+ process is running
        run: |
          if docker exec smoke-test pgrep -f nicotine > /dev/null 2>&1; then
            echo "Nicotine+ process is running"
          else
            echo "::error::Nicotine+ process is not running"
            docker logs smoke-test
            exit 1
          fi

      - name: Verify Nicotine+ GUI window loaded
        run: |
          # Auto-detect DISPLAY from the nicotine process environment
          NICOTINE_PID=$(docker exec smoke-test pgrep -f nicotine | head -1)
          DISPLAY_VAR=$(docker exec smoke-test bash -c "cat /proc/${NICOTINE_PID}/environ 2>/dev/null | tr '\0' '\n' | grep ^DISPLAY= | head -1")
          echo "Nicotine+ PID: ${NICOTINE_PID}, ${DISPLAY_VAR}"

          echo "Waiting for Nicotine+ window to appear..."
          for i in $(seq 1 30); do
            WINDOWS=$(docker exec smoke-test bash -c "${DISPLAY_VAR} xdotool search --name 'Nicotine' 2>/dev/null" || true)
            if [ -n "$WINDOWS" ]; then
              echo "Nicotine+ GUI window detected after ~$((i * 2))s (window IDs: $WINDOWS)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Nicotine+ GUI window did not appear within 60s"
          docker logs smoke-test
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Verify Selkies web UI loads in browser
        run: |
          cd tests/smoke
          npm ci --ignore-scripts
          npx playwright install chromium --with-deps
          node verify-selkies-ui.js

      - name: Start container with custom HTTP port
        run: |
          docker run -d \
            --name smoke-test-custom-port \
            -e PUID=1000 \
            -e PGID=1000 \
            -e CUSTOM_PORT=6082 \
            --shm-size=1gb \
            ${{ env.TEST_IMAGE }}:latest

      - name: Verify healthcheck status
        run: |
          for CONTAINER in smoke-test smoke-test-custom-port; do
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER")
              echo "$CONTAINER healthcheck status: $STATUS (attempt $i/60)"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "$STATUS" != "healthy" ]; then
              echo "::error::$CONTAINER did not become healthy within 120s (status: $STATUS)"
              docker inspect --format='{{json .State.Health}}' "$CONTAINER"
              exit 1
            fi
          done

      - name: Dump logs on failure
        if: failure()
        run: |
          for CONTAINER in smoke-test smoke-test-custom-port; do
            if docker container inspect "$CONTAINER" > /dev/null 2>&1; then
              echo "::group::$CONTAINER logs"
              docker logs "$CONTAINER"
              echo "::endgroup::"
            fi
          done

  # Preserve the existing required check while gating on both matrix jobs.
  smoke-test-result:
    name: Smoke Test
    needs: smoke-test
    if: ${{ always() }}
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Require both architectures to pass
        env:
          RESULT: ${{ needs.smoke-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Smoke tests did not pass on both architectures (result: $RESULT)"
            exit 1
          fi
