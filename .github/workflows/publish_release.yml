name: Publish Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"  # Rebuild weekly on Tuesdays to pick up base image and dependency updates
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}

concurrency:
  group: publish-${{ github.ref_protected && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'release' || 'preview' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-slim
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      is_release: ${{ steps.metadata.outputs.is_release }}
      preview_tag: ${{ steps.metadata.outputs.preview_tag }}
    steps:
      - name: Generate build and publishing metadata
        id: metadata
        shell: bash
        env:
          PUBLISH_REF: ${{ github.ref }}
          PUBLISH_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SLUG=$(printf '%s' "$PUBLISH_REF_NAME" | LC_ALL=C sed -E 's/[^a-zA-Z0-9_.-]+/-/g' | cut -c1-107)
          BRANCH_HASH=$(printf '%s' "$PUBLISH_REF" | sha256sum | cut -c1-12)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          IS_RELEASE=false
          if [[ "$PUBLISH_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            IS_RELEASE=true
          fi
          {
            echo "build_date=$BUILD_DATE"
            echo "is_release=$IS_RELEASE"
            echo "preview_tag=preview-${SLUG}-${BRANCH_HASH}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and Push Docker Image
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set platform variables
        id: platform
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "docker_platform=linux/arm64" >> "$GITHUB_OUTPUT"
            echo "base_image=ghcr.io/linuxserver/baseimage-selkies:arm64v8-ubuntunoble" >> "$GITHUB_OUTPUT"
          else
            echo "docker_platform=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "base_image=ghcr.io/linuxserver/baseimage-selkies:ubuntunoble" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Current Release Version
        id: get_version
        run: echo "VERSION=$(cat .github/.current-release)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.platform.outputs.docker_platform }}
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: |
            BASE_IMAGE=${{ steps.platform.outputs.base_image }}
            VERSION=${{ steps.get_version.outputs.VERSION }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          outputs: type=image,name=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: build
    uses: ./.github/workflows/smoke_test.yml
    permissions:
      contents: read
      packages: read
    with:
      image-repository: ghcr.io/${{ github.repository }}

  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare, build, smoke-test]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Current Release Version
        id: get_version
        run: echo "VERSION=$(cat .github/.current-release)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ needs.prepare.outputs.is_release == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ needs.prepare.outputs.is_release == 'true' && env.DOCKERHUB_IMAGE_NAME || '' }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.get_version.outputs.VERSION }},enable=${{ needs.prepare.outputs.is_release }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_release }}
            type=raw,value=${{ needs.prepare.outputs.preview_tag }},enable=${{ needs.prepare.outputs.is_release != 'true' }}

      - name: Resolve digests
        id: digests
        run: |
          AMD64_DIGEST="sha256:$(ls /tmp/digests/digest-amd64/)"
          ARM64_DIGEST="sha256:$(ls /tmp/digests/digest-arm64/)"
          echo "amd64=$AMD64_DIGEST" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Tag per-platform images (GHCR)
        if: ${{ needs.prepare.outputs.is_release == 'true' }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          docker buildx imagetools create --prefer-index=false \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:amd64-${VERSION} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:amd64-latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.amd64 }}
          docker buildx imagetools create --prefer-index=false \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:arm64-${VERSION} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:arm64-latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.arm64 }}

      - name: Tag per-platform images (Docker Hub)
        if: ${{ needs.prepare.outputs.is_release == 'true' }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          docker buildx imagetools create --prefer-index=false \
            -t ${{ env.DOCKERHUB_IMAGE_NAME }}:amd64-${VERSION} \
            -t ${{ env.DOCKERHUB_IMAGE_NAME }}:amd64-latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.amd64 }}
          docker buildx imagetools create --prefer-index=false \
            -t ${{ env.DOCKERHUB_IMAGE_NAME }}:arm64-${VERSION} \
            -t ${{ env.DOCKERHUB_IMAGE_NAME }}:arm64-latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.arm64 }}

      - name: Create manifest list and push (GHCR)
        id: publish-ghcr
        run: |
          TAG_ARGS=$(jq -r --arg prefix "${{ env.GHCR_REGISTRY }}/" \
            '.tags[] | select(startswith($prefix)) | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t TAGS <<< "$TAG_ARGS"
          docker buildx imagetools create \
            "${TAGS[@]}" \
            --metadata-file "$RUNNER_TEMP/ghcr-manifest.json" \
            --annotation "index:org.opencontainers.image.title=${{ github.event.repository.name }}" \
            --annotation "index:org.opencontainers.image.description=${{ github.event.repository.description }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.vendor=${{ github.repository_owner }}" \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.amd64 }} \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.arm64 }}
          DIGEST=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/ghcr-manifest.json")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push (Docker Hub)
        if: ${{ needs.prepare.outputs.is_release == 'true' }}
        run: |
          TAG_ARGS=$(jq -r --arg prefix "${{ env.GHCR_REGISTRY }}/" \
            '.tags[] | select(startswith($prefix) | not) | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t TAGS <<< "$TAG_ARGS"
          docker buildx imagetools create \
            "${TAGS[@]}" \
            --annotation "index:org.opencontainers.image.title=${{ github.event.repository.name }}" \
            --annotation "index:org.opencontainers.image.description=${{ github.event.repository.description }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.vendor=${{ github.repository_owner }}" \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.amd64 }} \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}@${{ steps.digests.outputs.arm64 }}

      - name: Attest GHCR image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          subject-digest: ${{ steps.publish-ghcr.outputs.digest }}
          push-to-registry: true

      - name: Summarize published images
        env:
          IMAGE_DIGEST: ${{ steps.publish-ghcr.outputs.digest }}
        run: |
          {
            echo "## Published images"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo
            echo "GHCR digest: \`${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
