name: Cleanup Images

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6:00 UTC
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR whose previews to clean up (0 runs weekly retention)"
        type: number
        default: 0
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  retention:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == 0) }}
    runs-on: ubuntu-latest
    concurrency:
      group: image-retention
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - name: Retain the newest 20 release images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          exclude-tags: preview-*
          delete-untagged: true
          delete-orphaned-images: true
          keep-n-tagged: 20
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retain the newest 20 preview images separately
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          use-regex: true
          delete-tags: ^preview-
          exclude-tags: ^(?!preview-).+
          delete-untagged: false
          keep-n-tagged: 20
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

  preview-plan:
    if: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number > 0) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      branch_ref: ${{ steps.plan.outputs.branch_ref }}
      delete_pattern: ${{ steps.plan.outputs.delete_pattern }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.sha }}

      - name: Plan cleanup for the PR branch
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/preview_images.py cleanup-plan

  cleanup-preview:
    needs: preview-plan
    if: ${{ needs.preview-plan.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.preview-plan.outputs.dry_run == 'true' && format('cleanup-preview-dry-run-{0}', github.run_id) || format('publish-preview-{0}', needs.preview-plan.outputs.branch_ref) }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.sha }}

      - name: Delete this branch's GHCR previews
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          use-regex: true
          delete-tags: ${{ needs.preview-plan.outputs.delete_pattern }}
          delete-untagged: false
          dry-run: ${{ needs.preview-plan.outputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete this branch's Docker Hub previews
        if: ${{ !cancelled() }}
        env:
          PUBLISH_REF: ${{ needs.preview-plan.outputs.branch_ref }}
          DRY_RUN: ${{ needs.preview-plan.outputs.dry_run }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: python3 scripts/preview_images.py dockerhub-cleanup
