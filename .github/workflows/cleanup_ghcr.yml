name: Cleanup Images

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  retention:
    runs-on: ubuntu-latest
    concurrency:
      group: image-retention
      cancel-in-progress: false
    steps:
      - name: Clean up preview images older than 24 hours
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          use-regex: true
          delete-tags: ^preview-
          exclude-tags: ^(?!preview-).+
          delete-untagged: false
          delete-orphaned-images: false
          older-than: 24 hours
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          token: ${{ secrets.GITHUB_TOKEN }}
